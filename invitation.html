    <meta property="og:description" content="Touchez le lien, écrivez votre prénom : quelqu’un du groupe vous fera entrer." />

    <meta name="theme-color" content="#b8761a" />
    <script>location.replace('./' + location.search + location.hash);</script>
  </head>

  </body>
</html>
