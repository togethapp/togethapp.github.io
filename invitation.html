<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- A doorway, not a page: a messaging app draws a link's preview from
         what the server sends, and never sees what follows the `#`. This page
         only gives the preview a title that says what was sent, then hands
         over to the app with the same address after the `#`. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Une invitation à rejoindre un groupe · Together</title>
    <meta name="description" content="Touchez le lien, écrivez votre prénom : quelqu’un du groupe vous fera entrer." />
    <meta property="og:site_name" content="Together" />
    <meta property="og:title" content="Together · une invitation à rejoindre un groupe" />
    <meta property="og:description" content="Touchez le lien, écrivez votre prénom : quelqu’un du groupe vous fera entrer." />
    <meta property="og:type" content="website" />
    <!-- The picture under the link, named in full as previews want it:
         @SITE@ becomes the site's address when it is published
         (.github/workflows/pages.yml). -->
    <meta property="og:image" content="@SITE@/icons/apercu.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Together — sondages, listes, comptes et parties, en famille et entre amis" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#b8761a" />
    <script>location.replace('./' + location.search + location.hash);</script>
  </head>
  <body>
    <p><a href="./">Ouvrir Together</a></p>
  </body>
</html>
